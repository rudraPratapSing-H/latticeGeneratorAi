<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F14" />
    <meta
      name="description"
      content="AI-driven lattice design with solver-verified properties for 3D printing"
    />
    <title>Lattice Designer</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L28 9 L28 23 L16 30 L4 23 L4 9 Z' fill='none' stroke='%2322D3EE' stroke-width='2'/%3E%3Cpath d='M16 2 L16 30 M4 9 L28 23 M28 9 L4 23' stroke='%2322D3EE' stroke-width='1.5' opacity='0.6'/%3E%3Ccircle cx='16' cy='2' r='2' fill='%2322D3EE'/%3E%3Ccircle cx='28' cy='9' r='2' fill='%2322D3EE'/%3E%3Ccircle cx='28' cy='23' r='2' fill='%2322D3EE'/%3E%3Ccircle cx='16' cy='30' r='2' fill='%2322D3EE'/%3E%3Ccircle cx='4' cy='23' r='2' fill='%2322D3EE'/%3E%3Ccircle cx='4' cy='9' r='2' fill='%2322D3EE'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2322D3EE'/%3E%3C/svg%3E"
    />
    <script>
      // Prevent dark mode flash: apply saved theme before first paint
      ;(function () {
        var t = localStorage.getItem('lattice-theme')
        if (t === 'light') return
        if (t === 'dark' || !window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
